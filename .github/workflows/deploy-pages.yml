name: Deploy simulation preview to GitHub Pages

# Publishes the SafeFlow SPA (simulation-only, static build) to GitHub Pages.
# Uses the built-in GITHUB_TOKEN — no secrets or external accounts required.
# The static build renders from bundled simulation fixtures; the backend /api is
# not deployed, and those calls fail closed gracefully (see signalClient.js).

on:
  push:
    branches: [codex/safeflow-prototype]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (simulation preview, base /wardsafe/)
        run: npm run build
        env:
          VITE_BASE: /wardsafe/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
