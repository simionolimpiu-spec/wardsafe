name: SafeFlow CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: safeflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Blocking gate: anything that can reach a user. Strict, no exceptions.
      - name: Check moderate-or-higher advisories in shipped dependencies
        run: npm audit --audit-level=moderate --omit=dev

      # Advisory-only: build-time-only dependencies. Reported, never blocking, because
      # some advisories here are structurally unfixable by us - e.g. brace-expansion is
      # vendored inside the aws-cdk-lib tarball ("inBundle": true), so npm `overrides`
      # cannot reach it and no aws-cdk-lib release has yet republished a patched copy.
      # Review this output on every run; when upstream ships a fix, bump and move on.
      # Rationale and review expectations: docs/public-demo-pack/build-readiness/ci-quality-gates.md
      - name: Report advisories in build-time-only dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Run API safety smoke
        env:
          SAFEFLOW_SIMULATION_ONLY: 'true'
        run: npm run api:smoke

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser safety journey
        run: npm run e2e

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safeflow-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  foundation:
    name: AWS and database foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAFEFLOW_SIMULATION_ONLY: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration manifest
        run: npm run db:manifest

      - name: Validate approved migration plan
        run: npm run db:migrate:plan

      - name: Synthesize dev foundation
        run: npm run infra:synth:dev

      - name: Synthesize simulation foundation
        run: npm run infra:synth:simulation

      - name: Prove pilot remains blocked
        shell: bash
        run: |
          set +e
          output=$(npm run infra:synth -- -c safeflowEnvironment=pilot 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Pilot synthesis unexpectedly succeeded"
            exit 1
          fi
          if [[ "$output" != *"restricted and not approved for synthesis or deployment"* ]]; then
            echo "Pilot synthesis failed for an unexpected reason"
            exit 1
          fi
          echo "Pilot profile remains blocked by default"

      - name: Upload synthesized templates
        uses: actions/upload-artifact@v4
        with:
          name: safeflow-cloudformation-templates
          path: ${{ runner.temp }}/safeflow-cdk/**/*.template.json
          if-no-files-found: error
          retention-days: 7
